name: VisionTestApp
options:
  bundleIdPrefix: com.mcp-test
  deploymentTarget:
    visionOS: "26.0"
targets:
  VisionTestApp:
    type: application
    platform: visionOS
    sources:
      - VisionTestApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mcp-test.playground.visionapp
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationPreferredDefaultSceneSessionRole: UIWindowSceneSessionRoleApplication
schemes:
  VisionTestApp:
    build:
      targets:
        VisionTestApp: all
    run:
      config: Debug
